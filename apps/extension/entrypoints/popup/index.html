<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ShieldGate</title>
    <link rel="stylesheet" href="../../src/ui/ext-page.css" />
    <style>
      /* 320px is the widest a browser-action popup can be before Chrome starts
         clipping it on small laptop displays; the tool list scrolls rather than
         growing the popup past a comfortable height. */
      body { width: 320px; }
      .sg-popup-body { padding: 12px 14px 14px; }
      .sg-status {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 9px 11px;
        margin-bottom: 12px;
        border: 1px solid var(--sg-border);
        border-radius: 10px;
        background: var(--sg-surface);
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--sg-fg-secondary);
      }
      .sg-status .sg-icon { margin-top: 1px; color: var(--sg-accent-text); }
      .sg-status.is-degraded { border-color: color-mix(in srgb, var(--sg-warn) 42%, transparent); background: var(--sg-warn-soft); color: var(--sg-warn-text); }
      .sg-status.is-degraded .sg-icon { color: var(--sg-warn); }
      .sg-section-title {
        margin: 0 0 6px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--sg-muted);
      }
      .sg-tools-card {
        padding: 4px 11px;
        border: 1px solid var(--sg-border);
        border-radius: 10px;
        background: var(--sg-surface);
        max-height: 232px;
        overflow-y: auto;
      }
      .sg-foot {
        margin: 12px 0 0;
        font-size: 10.5px;
        color: var(--sg-faint);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="sg-head">
      <span class="sg-mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="sg-icon">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </span>
      <span>
        <span class="sg-wordmark">ShieldGate</span>
        <span class="sg-tagline">AI governance</span>
      </span>
    </header>

    <div class="sg-popup-body">
      <div id="statusCard" class="sg-status">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="sg-icon" aria-hidden="true">
          <circle cx="12" cy="12" r="9" /><path d="M12 11v5" /><path d="M12 8h.01" />
        </svg>
        <p id="status" data-testid="sg-popup-status" style="margin: 0">Loading…</p>
      </div>

      <p class="sg-section-title">Registered tools</p>
      <div class="sg-tools-card">
        <ul id="tools" data-testid="sg-popup-tools" class="sg-list"></ul>
      </div>

      <p class="sg-foot">Policy is enforced by the backend. This popup only mirrors it.</p>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
