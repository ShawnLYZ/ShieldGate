<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShieldGate Options</title>
    <link rel="stylesheet" href="../../src/ui/ext-page.css" />
    <style>
      .sg-page { max-width: 520px; margin: 0 auto; padding: 32px 20px 48px; }
      .sg-page > .sg-head {
        border: 0;
        padding: 0 0 20px;
        background: none;
      }
      .sg-card {
        padding: 18px;
        border: 1px solid var(--sg-border);
        border-radius: 14px;
        background: var(--sg-surface);
        box-shadow: 0 8px 24px -12px rgb(0 0 0 / 0.4);
      }
      .sg-card h2 {
        margin: 0 0 3px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .sg-card p.sg-lede {
        margin: 0 0 18px;
        font-size: 12px;
        color: var(--sg-muted);
      }
      .sg-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
        padding-top: 16px;
        border-top: 1px solid var(--sg-border);
      }
      /* The save confirmation is deliberately two elements: the icon is a
         sibling of #status, never a child, so #status's text content stays
         exactly the word it reports. */
      #savedIcon { display: none; color: var(--sg-allow); }
      #savedIcon.is-visible { display: block; }
      #status { font-size: 12px; font-weight: 500; color: var(--sg-allow-text); }
      .sg-note {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        padding: 10px 12px;
        border: 1px solid var(--sg-border);
        border-radius: 10px;
        background: var(--sg-surface-2);
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--sg-muted);
      }
      .sg-note .sg-icon { margin-top: 1px; color: var(--sg-accent-text); }
    </style>
  </head>
  <body>
    <div class="sg-page">
      <header class="sg-head">
        <span class="sg-mark" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="sg-icon">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
        </span>
        <span>
          <span class="sg-wordmark">ShieldGate</span>
          <span class="sg-tagline">Extension settings</span>
        </span>
      </header>

      <main class="sg-card">
        <h2>Connection</h2>
        <p class="sg-lede">
          Where this extension sends prompts for classification, and which employee identity it
          presents.
        </p>

        <label class="sg-field">
          <span class="sg-field-label">Backend URL</span>
          <input id="backendUrl" class="sg-input" type="url" spellcheck="false" autocomplete="off" />
          <span class="sg-field-hint">The FastAPI gateway. Classification, policy and audit all go through it.</span>
        </label>

        <label class="sg-field">
          <span class="sg-field-label">Employee token</span>
          <input id="employeeToken" class="sg-input" type="text" spellcheck="false" autocomplete="off" />
          <span class="sg-field-hint">Identifies you to the backend, which pseudonymises it before anything is written to the audit chain.</span>
        </label>

        <div class="sg-actions">
          <button id="save" class="sg-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="sg-icon" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
              <path d="M17 21v-8H7v8" /><path d="M7 3v5h8" />
            </svg>
            Save
          </button>
          <svg id="savedIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sg-icon" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" />
          </svg>
          <span id="status" role="status"></span>
        </div>

        <p class="sg-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="sg-icon" aria-hidden="true">
            <circle cx="12" cy="12" r="9" /><path d="M12 11v5" /><path d="M12 8h.01" />
          </svg>
          <span>
            Raw prompt text is never persisted. The backend stores a masked excerpt on the audit
            chain and a sha256 hash for provenance — never the original content.
          </span>
        </p>
      </main>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
